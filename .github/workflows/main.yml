name: Run JavaScript Program

on:
  push:
  pull_request:

jobs:
  run-javascript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JavaScript program
        run: node program.js
