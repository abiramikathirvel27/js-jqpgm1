<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program</title>
</head>
<body>

    <h1>JavaScript Program Output</h1>

    <p id="output"></p>

    <script>
        // Store the length and breadth
        let length = 10;
        let breadth = 5;

        // Calculate the area
        let area = length * breadth;

        // Display the result
        document.getElementById("output").innerHTML =
            "Length: " + length + "<br>" +
            "Breadth: " + breadth + "<br>" +
            "Area of Rectangle: " + area;
    </script>

</body>
</html>
